<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Video Object Tracker</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <!-- =================================
         APP
    ================================== -->

    <main id="app">

        <!-- =================================
             HEADER
        ================================== -->

        <header class="app-header">

            <div class="app-title">

                <h1>Video Object Tracker</h1>

                <span id="trackingStatus">
                    Ready
                </span>

            </div>

            <div class="header-actions">

                <button
                    id="uploadButton"
                    type="button"
                >
                    Upload Video
                </button>

                <input
                    id="videoInput"
                    type="file"
                    accept="video/*"
                    hidden
                >

            </div>

        </header>


        <!-- =================================
             MAIN CONTENT
        ================================== -->

        <section class="workspace">

            <!-- =================================
                 VIDEO AREA
            ================================== -->

            <div
                id="stage"
                class="video-stage"
            >

                <video
                    id="video"
                    playsinline
                    preload="metadata"
                ></video>

                <!--
                    Transparent canvas placed directly
                    over the displayed video.
                -->

                <canvas
                    id="overlayCanvas"
                ></canvas>

                <!--
                    Tracker DOM layer.

                    tracker.js can use this layer for
                    interactive tracker controls.
                -->

                <div
                    id="trackerLayer"
                    class="tracker-layer"
                ></div>


                <!-- Empty state -->

                <div
                    id="videoPlaceholder"
                    class="video-placeholder"
                >

                    <div class="placeholder-icon">
                        🎬
                    </div>

                    <div>
                        Upload a video to start
                    </div>

                </div>

            </div>


            <!-- =================================
                 CONTROLS
            ================================== -->

            <div class="controls-panel">

                <!-- VIDEO CONTROLS -->

                <div class="control-group">

                    <button
                        id="playButton"
                        type="button"
                    >
                        ▶ Play
                    </button>

                    <button
                        id="pauseButton"
                        type="button"
                    >
                        ⏸ Pause
                    </button>

                    <button
                        id="stopButton"
                        type="button"
                    >
                        ⏹ Stop
                    </button>

                </div>


                <!-- EDIT / TRACKING -->

                <div class="control-group">

                    <button
                        id="editButton"
                        type="button"
                        class="active"
                    >
                        ✏ Edit
                    </button>

                    <button
                        id="lockButton"
                        type="button"
                    >
                        🔒 Lock
                    </button>

                    <button
                        id="unlockButton"
                        type="button"
                    >
                        🔓 Unlock
                    </button>

                    <button
                        id="deleteButton"
                        type="button"
                    >
                        🗑 Delete
                    </button>

                    <button
                        id="resetButton"
                        type="button"
                    >
                        ↻ Reset
                    </button>

                </div>


                <!-- =================================
                     TRACKER STYLE
                ================================== -->

                <div class="control-section">

                    <label>
                        Tracker Style
                    </label>

                    <div class="style-buttons">

                        <button
                            id="squareButton"
                            type="button"
                            data-style="square"
                        >
                            □ Square
                        </button>

                        <button
                            id="circleButton"
                            type="button"
                            data-style="circle"
                        >
                            ○ Circle
                        </button>

                        <button
                            id="triangleButton"
                            type="button"
                            data-style="triangle"
                        >
                            △ Triangle
                        </button>

                    </div>

                </div>


                <!-- =================================
                     STYLE SELECT
                ================================== -->

                <div class="control-section">

                    <label
                        for="styleSelect"
                    >
                        Shape
                    </label>

                    <select
                        id="styleSelect"
                    >

                        <option value="square">
                            Square
                        </option>

                        <option value="circle">
                            Circle
                        </option>

                        <option value="triangle">
                            Triangle
                        </option>

                    </select>

                </div>


                <!-- =================================
                     COLOR
                ================================== -->

                <div class="control-section">

                    <label
                        for="colorPicker"
                    >
                        Tracker Color
                    </label>

                    <input
                        id="colorPicker"
                        type="color"
                        value="#00ff66"
                    >

                </div>


                <!-- =================================
                     SIZE
                ================================== -->

                <div class="control-section">

                    <label
                        for="sizeSlider"
                    >
                        Tracker Size
                    </label>

                    <input
                        id="sizeSlider"
                        type="range"
                        min="20"
                        max="500"
                        value="120"
                        step="1"
                    >

                </div>


                <!-- =================================
                     SENSITIVITY
                ================================== -->

                <div class="control-section">

                    <div class="range-label">

                        <label
                            for="sensitivitySlider"
                        >
                            Tracking Sensitivity
                        </label>

                        <span
                            id="sensitivityValue"
                        >
                            65%
                        </span>

                    </div>

                    <input
                        id="sensitivitySlider"
                        type="range"
                        min="0"
                        max="1"
                        value="0.65"
                        step="0.01"
                    >

                </div>


                <!-- =================================
                     TRACKER INFORMATION
                ================================== -->

                <div class="tracker-info">

                    <div class="info-row">

                        <span>
                            Trackers
                        </span>

                        <strong
                            id="trackerCount"
                        >
                            0
                        </strong>

                    </div>


                    <div class="info-row">

                        <span>
                            Selected
                        </span>

                        <strong
                            id="selectedTracker"
                        >
                            None
                        </strong>

                    </div>


                    <div class="info-row">

                        <span>
                            Edit Mode
                        </span>

                        <strong
                            id="editStatus"
                        >
                            ON
                        </strong>

                    </div>


                    <div class="info-row">

                        <span>
                            Lock Status
                        </span>

                        <strong
                            id="lockStatus"
                        >
                            —
                        </strong>

                    </div>

                </div>


                <!-- =================================
                     TIME
                ================================== -->

                <div class="video-time">

                    <span id="currentTime">
                        00:00
                    </span>

                    <span>
                        /
                    </span>

                    <span id="duration">
                        00:00
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <!-- Configuration -->

    <script
        src="config.js"
        defer
    ></script>


    <!-- Utility functions -->

    <script
        src="utils.js"
        defer
    ></script>


    <!-- Video controller -->

    <script
        src="video.js"
        defer
    ></script>


    <!-- Tracker system -->

    <script
        src="tracker.js"
        defer
    ></script>


    <!-- Tracking engine -->

    <script
        src="tracking-engine.js"
        defer
    ></script>


    <!-- Background worker support -->

    <script
        src="tracking-worker.js"
        defer
    ></script>


    <!-- UI -->

    <script
        src="ui.js"
        defer
    ></script>


    <!-- Main application -->

    <script
        src="app.js"
        defer
    ></script>

</body>
</html>
